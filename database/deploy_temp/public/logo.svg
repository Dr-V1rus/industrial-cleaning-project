<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f33"/>
      <stop offset="100%" stop-color="#102a44"/>
    </linearGradient>

    <!-- Shine gradient -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="70" rx="14" fill="url(#bg)"/>

  <!-- Shine sweep -->
  <rect x="-120" y="0" width="120" height="70" fill="url(#shine)" opacity="0.7">
    <animate attributeName="x" from="-120" to="260" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Elegant sparkle -->
  <g transform="translate(40,20)">
    <path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z"
          fill="#c9a96e">
      <animateTransform attributeName="transform"
        type="scale"
        values="1;1.25;1"
        dur="2s"
        repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="1;0.6;1"
        dur="2s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Text -->
  <text x="70" y="40" font-size="26" fill="#ffffff"
        font-family="Georgia, serif" letter-spacing="0.5">
    Oriefi's
  </text>

  <text x="155" y="40" font-size="26" fill="#c9a96e"
        font-family="Georgia, serif" font-weight="700" letter-spacing="0.5">
    Clean
  </text>

  <!-- Optional subtle tagline -->
  <text x="70" y="58" font-size="10" fill="#d8c9a3"
        font-family="Georgia, serif" opacity="0.8">
    Premium Cleaning Services
  </text>
</svg>
